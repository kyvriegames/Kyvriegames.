<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PIXELPORT — 54 Free Games + School Tools</title>
<meta name="description" content="A retro arcade of 54 hand-built browser games plus a study hub with flashcards, timers, and calculators.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ PIXELPORT design system ============ */
:root {
  --font-display: 'Bungee', 'Space Grotesk', sans-serif;
  --font-body: 'Space Grotesk', 'Helvetica Neue', sans-serif;
  --bg: #0b0e1a;
  --bg-2: #101426;
  --panel: #151a30;
  --panel-2: #1b2140;
  --border: #262e55;
  --border-soft: #20263f;
  --text: #e8ecff;
  --muted: #8b93b8;
  --faint: #5a6184;
  --lime: #a3e635;
  --cyan: #22d3ee;
  --pink: #f472b6;
  --amber: #fbbf24;
  --violet: #a78bfa;
  --red: #fb7185;
  --green: #34d399;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
  --radius: 14px;
  --radius-sm: 10px;
  --t: 160ms cubic-bezier(0.16, 1, 0.3, 1);
  --text-xs: 12px;
  --text-sm: 14px;
  --text-base: 16px;
  --text-lg: 20px;
  --text-xl: clamp(24px, 3vw, 34px);
}
@media (prefers-color-scheme: light) {
  :root { color-scheme: dark; }
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: none; text-size-adjust: none; -webkit-font-smoothing: antialiased; scroll-behavior: smooth; }
body {
  min-height: 100dvh;
  font-family: var(--font-body);
  font-size: var(--text-base);
  line-height: 1.6;
  color: var(--text);
  background:
    radial-gradient(1100px 500px at 85% -10%, rgba(167, 139, 250, 0.13), transparent 60%),
    radial-gradient(900px 480px at -10% 10%, rgba(34, 211, 238, 0.10), transparent 55%),
    var(--bg);
}
img, canvas, svg { display: block; max-width: 100%; }
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
input, textarea, select { font: inherit; color: inherit; }
a { color: var(--cyan); text-decoration: none; transition: color var(--t); }
::selection { background: rgba(163, 230, 53, 0.3); }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; border-radius: 4px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

.wrap { max-width: 1180px; margin-inline: auto; padding-inline: clamp(14px, 3vw, 28px); }

/* ============ header ============ */
header.site {
  position: sticky; top: 0; z-index: 50;
  background: rgba(11, 14, 26, 0.82);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border-soft);
}
.site-inner { display: flex; align-items: center; gap: var(--space-4, 16px); padding-block: 12px; flex-wrap: wrap; }
.logo { display: flex; align-items: center; gap: 10px; user-select: none; cursor: pointer; }
.logo-mark {
  width: 38px; height: 38px; border-radius: 10px; flex: none;
  background: linear-gradient(135deg, var(--cyan), var(--violet));
  display: grid; place-items: center;
  font-family: var(--font-display); font-size: 18px; color: #0b0e1a;
  box-shadow: 0 0 18px rgba(34, 211, 238, 0.35);
}
.logo-text { font-family: var(--font-display); font-size: 20px; letter-spacing: 1px; line-height: 1; }
.logo-text em { font-style: normal; color: var(--lime); }
nav.tabs { display: flex; gap: 6px; margin-left: auto; align-items: center; flex-wrap: wrap; }
nav.tabs button {
  padding: 8px 14px; border-radius: 999px; font-weight: 600; font-size: var(--text-sm);
  color: var(--muted); border: 1px solid transparent; transition: all var(--t);
}
nav.tabs button:hover { color: var(--text); background: var(--panel-2); }
nav.tabs button.active { color: #0b0e1a; background: var(--lime); border-color: var(--lime); }
.icon-btn {
  width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--border);
  display: grid; place-items: center; color: var(--muted); transition: all var(--t);
}
.icon-btn:hover { color: var(--text); border-color: var(--cyan); }
.icon-btn.muted-on { color: var(--lime); border-color: var(--lime); }

/* ============ hero ============ */
.hero { padding: clamp(30px, 6vw, 64px) 0 clamp(20px, 4vw, 36px); text-align: center; }
.hero .kicker {
  display: inline-flex; align-items: center; gap: 8px; font-size: var(--text-xs);
  letter-spacing: 2.5px; text-transform: uppercase; color: var(--lime); font-weight: 700;
  border: 1px solid rgba(163, 230, 53, 0.35); padding: 6px 14px; border-radius: 999px;
  background: rgba(163, 230, 53, 0.07);
}
.hero h1 {
  font-family: var(--font-display); font-size: clamp(38px, 7vw, 72px); line-height: 1.05;
  margin: 18px 0 10px; letter-spacing: 1px;
  text-shadow: 0 0 42px rgba(34, 211, 238, 0.25);
}
.hero h1 .g1 { color: var(--cyan); } .hero h1 .g2 { color: var(--pink); } .hero h1 .g3 { color: var(--lime); }
.hero p { color: var(--muted); max-width: 560px; margin-inline: auto; }
.hero-stats { display: flex; gap: 26px; justify-content: center; margin-top: 22px; flex-wrap: wrap; }
.hero-stats div { text-align: center; }
.hero-stats b { font-size: 26px; font-family: var(--font-display); color: var(--lime); display: block; line-height: 1.2; }
.hero-stats span { font-size: var(--text-xs); color: var(--faint); text-transform: uppercase; letter-spacing: 1.5px; }

/* ============ controls bar ============ */
.controls { display: flex; gap: 12px; align-items: center; margin: 8px 0 22px; flex-wrap: wrap; }
.chip-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 22px; }
.search-box { position: relative; flex: 1 1 240px; min-width: 200px; }
.search-box input {
  width: 100%; padding: 11px 14px 11px 40px; border-radius: 12px;
  background: var(--panel); border: 1px solid var(--border); color: var(--text);
  transition: border-color var(--t);
}
.search-box input:focus { outline: none; border-color: var(--cyan); }
.search-box svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--faint); }
.chip {
  padding: 8px 14px; border-radius: 999px; font-size: var(--text-sm); font-weight: 600;
  border: 1px solid var(--border); color: var(--muted); transition: all var(--t); white-space: nowrap;
}
.chip:hover { color: var(--text); border-color: var(--muted); }
.chip.active { color: #0b0e1a; background: var(--cyan); border-color: var(--cyan); }
.result-count { font-size: var(--text-xs); color: #9aa2c7; }

/* ============ game grid ============ */
.grid-games {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr));
  gap: 14px; padding-bottom: 60px;
}
.gcard {
  position: relative; text-align: left; border-radius: var(--radius); padding: 14px;
  background: var(--panel); border: 1px solid var(--border-soft);
  transition: transform var(--t), border-color var(--t), box-shadow var(--t);
  overflow: hidden; display: flex; flex-direction: column; gap: 8px;
}
.gcard:hover { transform: translateY(-4px); border-color: var(--accent, var(--cyan)); box-shadow: 0 12px 28px rgba(0,0,0,.45); }
.gcard .emoji {
  font-size: 30px; width: 54px; height: 54px; border-radius: 12px; display: grid; place-items: center;
  background: color-mix(in srgb, var(--accent, var(--cyan)) 16%, transparent);
  border: 1px solid color-mix(in srgb, var(--accent, var(--cyan)) 35%, transparent);
}
.gcard .gname { font-weight: 700; font-size: 15px; line-height: 1.3; }
.gcard .gdesc { font-size: var(--text-xs); color: var(--muted); line-height: 1.45; flex: 1; }
.gcard .gmeta { display: flex; justify-content: space-between; align-items: center; font-size: var(--text-xs); color: var(--faint); }
.gcard .gcat { color: var(--accent, var(--cyan)); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; font-size: 10px; }
.gcard .best { font-variant-numeric: tabular-nums; }

/* ============ game page ============ */
.game-page { padding: 20px 0 70px; }
.game-head { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; flex-wrap: wrap; }
.back-btn {
  display: inline-flex; align-items: center; gap: 7px; padding: 9px 16px; border-radius: 10px;
  border: 1px solid var(--border); color: var(--muted); font-weight: 600; font-size: var(--text-sm);
  transition: all var(--t);
}
.back-btn:hover { color: var(--text); border-color: var(--cyan); }
.game-title { font-family: var(--font-display); font-size: clamp(20px, 3vw, 30px); letter-spacing: 0.5px; }
.game-desc { color: var(--muted); font-size: var(--text-sm); margin-left: auto; max-width: 380px; text-align: right; }
@media (max-width: 640px) { .game-desc { margin-left: 0; text-align: left; } }

.stage-wrap { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.stage {
  position: relative; border-radius: var(--radius); overflow: hidden;
  background: var(--bg-2); border: 1px solid var(--border);
  box-shadow: var(--shadow); line-height: 0; max-width: 100%;
}
.stage canvas { max-width: 100%; height: auto; touch-action: none; }
.hud {
  display: flex; gap: 18px; align-items: center; justify-content: center; flex-wrap: wrap;
  font-variant-numeric: tabular-nums; font-weight: 600; font-size: var(--text-sm);
}
.hud .hud-item { display: flex; gap: 7px; align-items: baseline; }
.hud .hud-label { color: #aab1d6; font-size: var(--text-xs); text-transform: uppercase; letter-spacing: 1px; }
.hud .hud-val { color: var(--lime); font-size: 16px; text-shadow: 0 0 10px rgba(163,230,53,0.3); }
.overlay {
  position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
  background: rgba(8, 10, 20, 0.88); backdrop-filter: blur(5px); z-index: 5; line-height: 1.4;
}
.overlay .ov-inner { padding: 24px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.overlay h2 { font-family: var(--font-display); font-size: clamp(22px, 4vw, 34px); color: var(--lime); letter-spacing: 1px; text-shadow: 0 0 24px rgba(163,230,53,0.35); }
.overlay p { color: #dde2f5; font-size: var(--text-sm); max-width: 300px; text-shadow: 0 1px 4px rgba(0,0,0,0.8); }
.btn {
  display: inline-flex; align-items: center; gap: 8px; padding: 11px 22px; border-radius: 12px;
  font-weight: 700; font-size: var(--text-sm); transition: all var(--t);
  background: var(--lime); color: #0b0e1a;
}
.btn:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(163, 230, 53, 0.35); }
.btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
.btn.ghost:hover { border-color: var(--cyan); box-shadow: none; }
.hint { color: #9aa2c7; font-size: var(--text-xs); text-align: center; }

/* ============ DOM game boards ============ */
.dom-stage { padding: 14px; display: flex; flex-direction: column; align-items: center; gap: 12px; line-height: normal; }
.bgrid { display: grid; gap: 5px; }
.cellb {
  border-radius: 8px; border: 1px solid var(--border); background: var(--panel-2);
  display: grid; place-items: center; font-weight: 700; transition: all 90ms; user-select: none;
  font-variant-numeric: tabular-nums;
}
.cellb:active { transform: scale(0.94); }
.wordrow { display: flex; gap: 6px; }
.wtile {
  width: 40px; height: 48px; border-radius: 8px; border: 1px solid var(--border);
  display: grid; place-items: center; font-weight: 700; font-size: 20px; text-transform: uppercase;
  background: var(--panel-2);
}
.form-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.form-row input, .form-row select {
  padding: 10px 12px; border-radius: 10px; background: var(--panel); border: 1px solid var(--border); color: var(--text);
  min-width: 90px; max-width: 100%;
}
.form-row input:focus { outline: none; border-color: var(--cyan); }

/* ============ school ============ */
.school-hero { text-align: center; padding: clamp(24px, 5vw, 50px) 0 10px; }
.school-hero h1 { font-family: var(--font-display); font-size: clamp(28px, 5vw, 48px); letter-spacing: 1px; }
.school-hero p { color: var(--muted); max-width: 520px; margin: 10px auto 0; }
.tool-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; padding: 26px 0 70px; }
.tool {
  background: var(--panel); border: 1px solid var(--border-soft); border-radius: var(--radius);
  padding: 20px; display: flex; flex-direction: column; gap: 12px;
}
.tool h3 { display: flex; align-items: center; gap: 10px; font-size: 17px; }
.tool h3 .t-emoji { font-size: 22px; }
.tool p.tsub { color: var(--muted); font-size: var(--text-xs); }
.tool .tarea { display: flex; flex-direction: column; gap: 10px; }
.tbtn {
  align-self: flex-start; padding: 9px 18px; border-radius: 10px; background: var(--cyan);
  color: #06222a; font-weight: 700; font-size: var(--text-sm); transition: all var(--t);
}
.tbtn:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(34, 211, 238, 0.35); }
.tbtn.lime { background: var(--lime); color: #1a2b06; }
.tbtn.lime:hover { box-shadow: 0 6px 18px rgba(163, 230, 53, 0.35); }
.tinput {
  padding: 10px 12px; border-radius: 10px; background: var(--bg-2); border: 1px solid var(--border);
  color: var(--text); width: 100%;
}
.tinput:focus { outline: none; border-color: var(--cyan); }
.card-list { display: flex; flex-direction: column; gap: 8px; max-height: 260px; overflow-y: auto; }
.list-item {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px;
  background: var(--bg-2); border: 1px solid var(--border-soft); font-size: var(--text-sm);
}
.list-item .tick {
  width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--faint); flex: none;
  display: grid; place-items: center; font-size: 12px; color: transparent; transition: all var(--t);
}
.list-item.done .tick { background: var(--green); border-color: var(--green); color: #052; }
.list-item.done .li-text { text-decoration: line-through; color: var(--faint); }
.list-item .li-text { flex: 1; word-break: break-word; }
.list-item .x { color: var(--faint); font-size: 16px; padding: 2px 6px; border-radius: 6px; }
.list-item .x:hover { color: var(--red); }
.flashcard {
  min-height: 150px; border-radius: var(--radius); border: 1px solid var(--border);
  background: linear-gradient(160deg, var(--panel-2), var(--bg-2));
  display: grid; place-items: center; text-align: center; padding: 20px; cursor: pointer;
  font-size: clamp(18px, 3vw, 26px); font-weight: 600; transition: transform var(--t);
}
.flashcard:hover { border-color: var(--cyan); }
.flashcard small { display: block; font-size: var(--text-xs); color: var(--faint); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1.5px; }
.timer-ring { display: flex; align-items: center; gap: 18px; justify-content: center; }
.timer-ring svg { width: 110px; height: 110px; }
.timer-display { font-family: var(--font-display); font-size: clamp(28px, 4vw, 40px); color: var(--lime); font-variant-numeric: tabular-nums; }
.timer-label { font-size: var(--text-xs); color: var(--faint); text-transform: uppercase; letter-spacing: 2px; text-align: center; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.seg button { padding: 8px 14px; font-size: var(--text-sm); color: var(--muted); font-weight: 600; transition: all var(--t); }
.seg button.active { background: var(--panel-2); color: var(--text); }
.formula-block { border: 1px solid var(--border-soft); border-radius: var(--radius-sm); padding: 14px; background: var(--bg-2); }
.formula-block h4 { font-size: 14px; color: var(--cyan); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
.formula-block ul { list-style: none; display: flex; flex-direction: column; gap: 6px; }
.formula-block li { font-size: var(--text-sm); color: var(--text); }
.formula-block li b { color: var(--lime); font-weight: 600; }
.gpa-row { display: grid; grid-template-columns: minmax(0, 1fr) 84px 84px 34px; gap: 8px; align-items: center; }
.gpa-row .tinput { width: 100%; min-width: 0; padding: 9px 10px; }
.conv-grid { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; }
.big-num { font-family: var(--font-display); font-size: clamp(24px, 4vw, 36px); color: var(--lime); text-align: center; }

/* ============ footer ============ */
footer.site { border-top: 1px solid var(--border-soft); padding: 26px 0; color: var(--faint); font-size: var(--text-xs); text-align: center; }
footer.site b { color: var(--muted); }

/* misc */
.fade-in { animation: fadeUp 260ms cubic-bezier(0.16, 1, 0.3, 1); }
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.empty-msg { grid-column: 1 / -1; text-align: center; color: var(--faint); padding: 40px 0; }
</style>
</head>

  <div class="wrap site-inner">

      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
    </button>
  </div>
</header>

<main id="app" class="wrap"></main>

<footer class="site">

    PIXEL<em>PORT</em> · 54 tiny games + study tools, all handmade in a single HTML file · no ads, no accounts, no tracking
  </div>
</footer>

<script>
"use strict";
/* ================= framework ================= */
const GAMES = [];
function reg(g) { GAMES.push(g); }
const $ = s => document.querySelector(s);
const rnd = n => Math.random() * n;
const ri = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const choice = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* ---- audio ---- */
let AC = null, soundOn = true;
function ac() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } return AC; }
function beep(freq, dur = 0.08, type = 'square', vol = 0.12, slide = 0) {
  if (!soundOn) return; const c = ac(); if (!c) return;
  try {
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.value = freq;
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), c.currentTime + dur);
    g.gain.setValueAtTime(vol, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + dur);
    o.connect(g).connect(c.destination); o.start(); o.stop(c.currentTime + dur);
  } catch (e) {}
}
const SFX = {
  click: () => beep(600, .05, 'square', .08),
  point: () => beep(880, .07, 'square', .1),
  combo: () => { beep(880, .06, 'square', .1); setTimeout(() => beep(1320, .06, 'square', .1), 60); },
  hit: () => beep(160, .12, 'sawtooth', .14, -80),
  over: () => { beep(300, .2, 'sawtooth', .12, -160); setTimeout(() => beep(180, .3, 'sawtooth', .1, -100), 150); },
  win: () => { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, .12, 'square', .1), i * 110)); },
  bad: () => beep(140, .18, 'square', .12, -60),
  tick: () => beep(1200, .03, 'sine', .06),
  swoosh: () => beep(400, .08, 'sine', .07, 300),
};

/* ---- best scores (session only) ---- */
const BEST = {};
function bestOf(id) { return BEST[id] || 0; }

/* ---- game host ---- */
let CURRENT_GAME_ID = null;

function createGame(host, opts = {}) {
  const w = opts.w || 480, h = opts.h || 640;
  const wrap = document.createElement('div');
  wrap.className = 'stage-wrap fade-in';
  const hud = document.createElement('div');
  hud.className = 'hud';
  const stage = document.createElement('div');
  stage.className = 'stage';
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  canvas.setAttribute('role', 'img');
  canvas.setAttribute('aria-label', (opts.name || 'game') + ' playfield');
  stage.appendChild(canvas);
  const hint = document.createElement('div');
  hint.className = 'hint';
  if (opts.hint) hint.textContent = opts.hint;
  wrap.append(hud, stage, hint);
  host.appendChild(wrap);

  const ctx = canvas.getContext('2d');
  const api = { canvas, ctx, w, h, stage, hudEl: hud, host };
  let raf = null, last = 0, destroyed = false, frameFn = null, overFlag = false;
  const keys = {}, pressedQ = new Set();
  const gameKeyEvent = e => {
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
    if (!keys[e.code]) pressedQ.add(e.code);
    keys[e.code] = true;
  };
  window.addEventListener('keydown', gameKeyEvent, { passive: false });
  window.addEventListener('keyup', e => { keys[e.code] = false; });

  api.destroy = () => {
    destroyed = true;
    if (raf) cancelAnimationFrame(raf);
    window.removeEventListener('keydown', gameKeyEvent);
  };
  api.isDown = c => !!keys[c];
  api.pressed = c => { if (pressedQ.has(c)) { pressedQ.delete(c); return true; } return false; };
  api.clearPressed = () => pressedQ.clear();
  api.frame = fn => { frameFn = fn; last = performance.now(); raf = requestAnimationFrame(function loop(t) { if (destroyed) return; const dt = Math.min((t - last) / 1000, 0.1); last = t; try { fn(dt, ctx); } catch (err) { console.error(err); } raf = requestAnimationFrame(loop); }); };
  api.hint = t => { hint.textContent = t; };

  /* HUD */
  const hudItems = {};
  api.hud = obj => {
    hud.innerHTML = '';
    for (const [k, v] of Object.entries(obj)) {
      const d = document.createElement('div');
      d.className = 'hud-item';
      d.innerHTML = `<span class="hud-label">${k}</span><span class="hud-val"></span>`;
      hud.appendChild(d);
      hudItems[k] = d.querySelector('.hud-val');
      hudItems[k].textContent = v;
    }
  };
  api.set = (k, v) => { if (hudItems[k]) hudItems[k].textContent = v; };

  /* overlay */
  function overlay(title, sub, buttons) {
    overFlag = true;
    if (raf) { cancelAnimationFrame(raf); raf = null; }
    const ov = document.createElement('div');
    ov.className = 'overlay';
    const inner = document.createElement('div');
    inner.className = 'ov-inner';
    inner.innerHTML = `<h2></h2>${sub ? '<p></p>' : ''}`;
    inner.querySelector('h2').textContent = title;
    if (sub) inner.querySelector('p').textContent = sub;
    const row = document.createElement('div');
    row.style.cssText = 'display:flex;gap:10px;flex-wrap:wrap;justify-content:center';
    (buttons || [{ label: 'Play Again', act: () => openGame(CURRENT_GAME_ID) }, { label: 'All Games', act: () => location.hash = '#/games', ghost: true }])
      .forEach(b => {
        const btn = document.createElement('button');
        btn.className = 'btn' + (b.ghost ? ' ghost' : '');
        btn.textContent = b.label;
        btn.addEventListener('click', () => { SFX.click(); b.act(); });
        row.appendChild(btn);
      });
    inner.appendChild(row);
    ov.appendChild(inner);
    stage.appendChild(ov);
    return ov;
  }
  api.over = (title, sub, buttons) => {
    if (overFlag) return; overFlag = true;
    SFX.over();
    if (opts.scoreKey && api._score > (BEST[opts.scoreKey] || 0)) BEST[opts.scoreKey] = api._score;
    overlay(title || 'GAME OVER', sub, buttons);
  };
  api.win = (sub, buttons) => {
    if (overFlag) return; overFlag = true;
    SFX.win();
    if (opts.scoreKey && api._score > (BEST[opts.scoreKey] || 0)) BEST[opts.scoreKey] = api._score;
    overlay('YOU WIN', sub, buttons);
  };
  api.overlay = overlay; // custom pause screens

  /* score */
  api._score = 0;
  api.setScore = n => { api._score = n; api.set('Score', n); };
  api.addScore = n => { api.setScore(api._score + n); };

  /* pointer (logical coords) */
  function pt(e) {
    const r = canvas.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { x: (t.clientX - r.left) * (w / r.width), y: (t.clientY - r.top) * (h / r.height) };
  }
  api.onDown = cb => canvas.addEventListener('pointerdown', e => { e.preventDefault(); canvas.setPointerCapture?.(e.pointerId); cb(pt(e), e); });
  api.onMove = cb => canvas.addEventListener('pointermove', e => cb(pt(e), e));
  api.onUp = cb => canvas.addEventListener('pointerup', e => cb(pt(e), e));

  /* swipes */
  api.swipe = cb => {
    let sx = 0, sy = 0, active = false;
    canvas.addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY; active = true; });
    canvas.addEventListener('pointerup', e => {
      if (!active) return; active = false;
      const dx = e.clientX - sx, dy = e.clientY - sy;
      if (Math.abs(dx) < 24 && Math.abs(dy) < 24) { cb('tap'); return; }
      cb(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
    });
  };

  /* DOM mode */
  api.dom = () => {
    canvas.style.display = 'none';
    const d = document.createElement('div');
    d.className = 'dom-stage';
    d.style.minWidth = Math.min(w, 480) + 'px';
    stage.appendChild(d);
    return d;
  };

  api.rand = { r: rnd, i: ri, pick: choice, sh: shuffle };
  return api;
}

/* background fill helper */
function bgFill(ctx, w, h, color) { ctx.fillStyle = color || '#101426'; ctx.fillRect(0, 0, w, h); }
function txt(ctx, t, x, y, size, color, align, font) {
  ctx.fillStyle = color || '#e8ecff';
  ctx.font = (font || `700 ${size}px 'Space Grotesk', sans-serif`);
  ctx.textAlign = align || 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(t, x, y);
}
function rr(ctx, x, y, w2, h2, r, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.roundRect ? ctx.roundRect(x, y, w2, h2, r) : ctx.rect(x, y, w2, h2);
  ctx.fill();
}

/* ---- shared snake engine ---- */
function snakeEngine(host, cfg) {
  const api = createGame(host, { w: 480, h: 480, name: cfg.name, hint: cfg.hint, scoreKey: cfg.id });
  const N = 24, C = 20;
  let snake, dir, nextDir, food, walls, score, dead, acc, step, wallsEaten;
  function reset() {
    snake = [{ x: 12, y: 12 }, { x: 11, y: 12 }, { x: 10, y: 12 }];
    dir = { x: 1, y: 0 }; nextDir = { x: 1, y: 0 };
    score = 0; dead = false; acc = 0; step = cfg.speed; wallsEaten = 0;
    walls = new Set();
    if (cfg.walls) { for (let i = 0; i < cfg.walls; i++) { const wx = ri(2, N - 3), wy = ri(1, N - 2); walls.add(wx + ',' + wy); } }
    placeFood();
    api.hud({ Score: 0, Best: bestOf(cfg.id) });
    api.setScore(0);
  }
  function placeFood() {
    do { food = { x: ri(0, N - 1), y: ri(0, N - 1) }; }
    while (snake.some(s => s.x === food.x && s.y === food.y) || walls.has(food.x + ',' + food.y));
  }
  function setDir(nx, ny) { if (nx === -dir.x && ny === -dir.y) return; nextDir = { x: nx, y: ny }; }
  const kd = e => {
    if (e.code === 'ArrowUp' || e.code === 'KeyW') setDir(0, -1);
    if (e.code === 'ArrowDown' || e.code === 'KeyS') setDir(0, 1);
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') setDir(-1, 0);
    if (e.code === 'ArrowRight' || e.code === 'KeyD') setDir(1, 0);
  };
  window.addEventListener('keydown', kd);
  api.swipe(d => { if (d === 'up') setDir(0, -1); if (d === 'down') setDir(0, 1); if (d === 'left') setDir(-1, 0); if (d === 'right') setDir(1, 0); });
  const oldDestroy = api.destroy;
  api.destroy = () => { window.removeEventListener('keydown', kd); oldDestroy(); };

  api.frame(dt => {
    if (!dead) {
      acc += dt;
      const spd = Math.max(0.055, step - score * 0.0018);
      while (acc > spd) { acc -= spd; tick(); }
    }
    draw();
  });
  function tick() {
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    if (cfg.wrap) { head.x = (head.x + N) % N; head.y = (head.y + N) % N; }
    else if (head.x < 0 || head.y < 0 || head.x >= N || head.y >= N) return die();
    if (walls.has(head.x + ',' + head.y)) return die();
    if (snake.some(s => s.x === head.x && s.y === head.y)) return die();
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score++; api.setScore(score); SFX.point(); placeFood();
    } else snake.pop();
  }
  function die() { dead = true; api.over('GAME OVER', `You scored ${score}. ${score >= bestOf(cfg.id) ? 'New personal best!' : 'Best: ' + bestOf(cfg.id)}`); }
  function draw() {
    bgFill(api.ctx, 480, 480, '#0d1120');
    api.ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    for (let i = 1; i < N; i++) { api.ctx.beginPath(); api.ctx.moveTo(i * C, 0); api.ctx.lineTo(i * C, 480); api.ctx.moveTo(0, i * C); api.ctx.lineTo(480, i * C); api.ctx.stroke(); }
    walls.forEach(k => { const [x, y] = k.split(','); rr(api.ctx, x * C + 1, y * C + 1, C - 2, C - 2, 4, '#3b3f66'); });
    // food
    const f = Math.sin(performance.now() / 200) * 2;
    api.ctx.fillStyle = '#fb7185';
    api.ctx.beginPath(); api.ctx.arc(food.x * C + C / 2, food.y * C + C / 2, C / 2 - 3 + f, 0, 7); api.ctx.fill();
    snake.forEach((s, i) => rr(api.ctx, s.x * C + 1, s.y * C + 1, C - 2, C - 2, 5, i === 0 ? '#a3e635' : `rgba(163,230,53,${0.85 - i / snake.length * 0.5})`));
  }
  reset();
  api.overlay('SNAKE', 'Eat, grow, don’t bite yourself. Arrow keys / swipe.', [{ label: 'Start', act: () => { stageClear(api); } }]);
}
function stageClear(api) { const ov = api.stage.querySelector('.overlay'); if (ov) ov.remove(); api._resume && api._resume(); }

reg({ id: 'wordsearch', name: 'Word Search', cat: 'Puzzle', emoji: '🔤', desc: 'Find 5 hidden words in the letter grid.', hint: 'Click and drag across letters', start: host => {
  const api = createGame(host, { w: 520, h: 520, name: 'Word Search' });
  const d = api.dom(); d.style.minWidth = '480px';
  const WORDS = ['PYTHON', 'PIXEL', 'ARCADE', 'SNAKE', 'LEVEL', 'SCORE', 'BRAIN', 'TOKEN', 'QUEST', 'MAGIC', 'LASER', 'TOWER'];
  const N = 10;
  let grid = [], placed = [], found = new Set(), selCells = [], dragging = false;
  api.hud({ Found: '0/5' });
  const wrap = document.createElement('div');
  wrap.style.cssText = 'display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap;justify-content:center';
  const board = document.createElement('div');
  board.style.cssText = 'display:grid;grid-template-columns:repeat(' + N + ',40px);gap:3px;user-select:none';
  const list = document.createElement('div');
  list.style.cssText = 'display:flex;flex-direction:column;gap:6px;font-size:15px;font-weight:600';
  wrap.append(board, list);
  d.appendChild(wrap);
  function build() {
    grid = Array.from({ length: N }, () => Array(N).fill(''));
    placed = [];
    const words = shuffle(WORDS).slice(0, 5);
    words.forEach(w => {
      for (let tries = 0; tries < 200; tries++) {
        const horiz = rnd(1) < 0.5, rev = rnd(1) < 0.3;
        const len = w.length;
        const r = ri(0, N - 1), c = ri(0, N - (horiz ? len : 1));
        const r2 = clamp(r, 0, N - (horiz ? 1 : len));
        if (horiz ? c + len > N : r2 + len > N) continue;
        let ok = true;
        for (let i = 0; i < len; i++) {
          const cell = grid[horiz ? r : r2 + i][horiz ? c + i : c];
          if (cell && cell !== (rev ? w[len - 1 - i] : w[i])) { ok = false; break; }
        }
        if (!ok) continue;
        for (let i = 0; i < len; i++) grid[horiz ? r : r2 + i][horiz ? c + i : c] = rev ? w[len - 1 - i] : w[i];
        placed.push(w);
        break;
      }
    });
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++)
      if (!grid[r][c]) grid[r][c] = choice('ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split(''));
  }
  function cellIndex(el) { return +el.dataset.i; }
  function render() {
    board.innerHTML = '';
    grid.forEach((row, r) => row.forEach((ch, c) => {
      const b = document.createElement('div');
      b.className = 'cellb';
      b.dataset.i = r * N + c;
      b.style.cssText = 'width:40px;height:40px;font-size:15px;background:#151a30;cursor:pointer';
      b.textContent = ch;
      const key = r + '-' + c;
      if (found.has(key)) { b.style.background = '#123021'; b.style.color = '#a3e635'; b.style.borderColor = '#1e4633'; }
      if (selCells.some(([rr, cc]) => rr === r && cc === c)) { b.style.background = '#a3e635'; b.style.color = '#0b0e1a'; }
      board.appendChild(b);
    }));
    list.innerHTML = '';
    placed.forEach(w => {
      const li = document.createElement('div');
      li.textContent = found.has(w) ? '✓ ' + w : w;
      li.style.color = found.has(w) ? '#a3e635' : '#8b93b8';
      if (found.has(w)) li.style.textDecoration = 'line-through';
      list.appendChild(li);
    });
  }
  board.addEventListener('pointerdown', e => {
    const t = e.target.closest('.cellb'); if (!t) return;
    dragging = true; selCells = [];
    const i = cellIndex(t);
    selCells = [[Math.floor(i / N), i % N]];
    render();
  });
  board.addEventListener('pointerover', e => {
    if (!dragging) return;
    const t = e.target.closest('.cellb'); if (!t) return;
    const i = cellIndex(t);
    const [r0, c0] = selCells[0];
    const r = Math.floor(i / N), c = i % N;
    const dr = r - r0, dc = c - c0;
    if (dr === 0 || dc === 0 || Math.abs(dr) === Math.abs(dc)) {
      const len = Math.max(Math.abs(dr), Math.abs(dc));
      selCells = Array.from({ length: len + 1 }, (_, k) => [r0 + Math.sign(dr) * k, c0 + Math.sign(dc) * k]);
      render();
    }
  });
  window.addEventListener('pointerup', () => {
    if (!dragging) return;
    dragging = false;
    const word = selCells.map(([r, c]) => grid[r][c]).join('');
    const rev = word.split('').reverse().join('');
    if (placed.includes(word) || placed.includes(rev)) {
      selCells.forEach(([r, c]) => found.add(r + '-' + c));
      (placed.includes(word) ? [word] : [rev]).forEach(w => found.add(w));
      SFX.point();
      api.set('Found', [...new Set(placed.filter(w => found.has(w)))].length + '/5');
      render();
      const foundWords = [...new Set(placed.filter(w => found.has(w)))];
      if (foundWords.length >= 5) { SFX.win(); api.win('All 5 words found! Sharp eyes.'); }
    }
    selCells = [];
    render();
  });
  build(); render();
}});

reg({ id: 'nim', name: 'Nim Sticks', cat: 'Board', emoji: '🎋', desc: 'Take sticks from one pile. Take the last one and lose.', hint: 'Click a pile, then how many to take', start: host => {

    if (over || !piles[i]) return;
    sel = i; SFX.tick();
    takeRow.innerHTML = '';
    for (let k = 1; k <= piles[i]; k++) {
      const b = document.createElement('button');
      b.className = 'cellb';
      b.style.cssText = 'width:52px;height:44px';
      b.textContent = '−' + k;
      b.addEventListener('click', () => take(i, k));
      takeRow.appendChild(b);
    }

  }

    piles[i] -= n;
    sel = -1; takeRow.innerHTML = '';

    if (piles.every(p => p === 0)) { over = true; SFX.win(); api.win('You took the last stick — CPU loses!'); return; }
    api.set('Turn', 'CPU'); msg.textContent = 'CPU is thinking…';
    setTimeout(cpu, 600);
  }
  function cpu() {
    if (over) return;
    // misère nim: aim to leave one stick total
    const total = piles.reduce((a, b) => a + b, 0);
    const x = piles.reduce((a, b) => a ^ b, 0);
    if (total > 1 && x !== 0) {
      for (let i = 0; i < piles.length; i++) {
        const t = piles[i] ^ x;
        if (t < piles[i]) { piles[i] = t; break; }
      }
    } else if (total > 1) {
      const i = piles.findIndex(p => p > 0);
      piles[i] -= 1;
    } else {
      const i = piles.findIndex(p => p > 0);
      piles[i] = 0;
    }
    SFX.tick(); render();
    msg.textContent = '';
    if (piles.every(p => p === 0)) { over = true; SFX.over(); api.over('CPU TOOK THE LAST ONE', 'You lose — better luck next time.'); return; }
    api.set('Turn', 'Yours');
  }

    <div class="controls fade-in">
      <div class="search-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="search" type="search" placeholder="Search 54 games…" value="${query.replace(/"/g, '"')}" aria-label="Search games">
      </div>
      <span class="result-count" id="count"></span>
    </div>
    <div class="chip-row fade-in">
      <button class="chip ${filter === 'All' ? 'active' : ''}" data-cat="All">All</button>
      ${Object.keys(CAT_COLORS).map(c => `<button class="chip ${filter === c ? 'active' : ''}" data-cat="${c}">${c}</button>`).join('')}
    </div>
    <div class="grid-games" id="grid"></div>
    <section class="school-hero" style="padding-bottom:0">
      <h1 style="font-size:clamp(22px,4vw,34px)">📚 SCHOOL HUB</h1>
      <p style="margin-bottom:8px">Games are more fun. Homework still exists. We built tools for both sides of your brain.</p>
      <button class="btn" data-nav="school" style="margin-top:8px">Open the School Hub →</button>
    </section>`;
  const grid = $('#grid');
  function paint() {
    const q = query.toLowerCase();
    const list = GAMES.filter(g => (filter === 'All' || g.cat === filter) && (!q || g.name.toLowerCase().includes(q) || g.desc.toLowerCase().includes(q) || g.cat.toLowerCase().includes(q)));
    $('#count').textContent = list.length + ' games';
    grid.innerHTML = '';
    if (!list.length) { grid.innerHTML = '<div class="empty-msg">No games match — try another word?</div>'; return; }
    list.forEach(g => {
      const b = document.createElement('button');
      b.className = 'gcard';
      b.style.setProperty('--accent', CAT_COLORS[g.cat]);
      const best = bestOf(g.id);
      b.innerHTML = `
        <div class="emoji">${g.emoji}</div>
        <div class="gname">${g.name}</div>
        <div class="gdesc">${g.desc}</div>
        <div class="gmeta"><span class="gcat">${g.cat}</span><span class="best">${best ? 'best ' + best : ''}</span></div>`;
      b.addEventListener('click', () => { SFX.click(); location.hash = '#/game/' + g.id; });
      grid.appendChild(b);
    });
  }
  document.querySelectorAll('.chip[data-cat]').forEach(ch => ch.addEventListener('click', () => {
    filter = ch.dataset.cat; query = '';
    renderHome();
  }));
  const si = $('#search');
  si.addEventListener('input', () => { query = si.value; paint(); });
  paint();
}

function gamePage(id) {
  const g = GAMES.find(x => x.id === id);
  if (!g) { location.hash = '#/'; return; }
  document.title = g.name + ' — PIXELPORT';
  CURRENT_GAME_ID = id;
  const app = $('#app');
  app.innerHTML = `
    <div class="game-page fade-in">
      <div class="game-head">
        <button class="back-btn" data-nav="games"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>All games</button>
        <div class="game-title">${g.emoji} ${g.name}</div>
        <div class="game-desc">${g.desc}</div>
      </div>
      <div id="game-host"></div>
    </div>`;
  const host = $('#game-host');
  try { g.start(host); } catch (e) { console.error(e); host.innerHTML = '<div class="empty-msg">This game hit a snag — try another!</div>'; }
  // best score tracking for games that don't set scoreKey
  if (!currentApi) { /* DOM-only games still return api via createGame; if not, nothing to clean */ }
}

function openGame(id) { location.hash = '#/game/' + id; }

/* patch: capture api for cleanup — createGame sets currentApi via this hook */
const _createGame = createGame;
createGame = function (host, opts) {
  cleanupGame();
  const api = _createGame(host, opts);
  currentApi = api;
  return api;
};

/* ---- global wiring ---- */
document.addEventListener('click', e => {
  const nav2 = e.target.closest('[data-nav]');
  if (nav2) {
    const t = nav2.dataset.nav;
    SFX.click();
    location.hash = t === 'home' ? '#/' : t === 'school' ? '#/school' : '#/';
    if (t === 'school') location.hash = '#/school';
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && location.hash.startsWith('#/game/')) location.hash = '#/';
});
window.addEventListener('hashchange', nav);

/* sound toggle */
const st = document.getElementById('sound-toggle');
st.addEventListener('click', () => {
  soundOn = !soundOn;
  st.classList.toggle('muted-on', soundOn);
  st.setAttribute('aria-label', soundOn ? 'Mute sound' : 'Unmute sound');
  st.innerHTML = soundOn
    ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>'
    : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="m23 9-6 6M17 9l6 6"/></svg>';
  if (soundOn) SFX.click();
});
st.classList.toggle('muted-on', true);

nav();

</script>
</body>
</html>
